<style>
  :root{
    --bg: #f2f3f5;
    --panel: #ffffff;
    --panel-2: #eef0f3;
    --line: #dde1e7;
    --ink: #1b2430;
    --ink-dim: #667085;
    --amber: #b96a12;
    --amber-dim: #f4dfb8;
    --red: #c8382b;
    --green: #23875a;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); min-height:100vh;
  }
  ::selection{background:var(--amber-dim);color:var(--ink);}

  /* --- Signature: guard-post signal lamp --- */
  .lamp{
    width:10px;height:10px;border-radius:50%;display:inline-block;
    box-shadow:0 0 8px 2px currentColor;
  }
  .lamp.ok{color:var(--green);background:var(--green);}
  .lamp.warn{color:var(--red);background:var(--red);animation:pulse 1.4s infinite;}
  .lamp.idle{color:var(--ink-dim);background:var(--ink-dim);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#ffffff,#f5f6f8);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);letter-spacing:.5px;}
  .brand b{color:var(--amber);font-weight:700;}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-dim);}
  .who button{
    background:transparent;border:1px solid var(--line);color:var(--ink-dim);
    padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--sans);
  }
  .who button:hover{border-color:var(--amber);color:var(--amber);}

  .wrap{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}

  /* Login */
  .login-shell{
    max-width:420px;margin:8vh auto 0;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:32px;
  }
  .login-shell h1{font-size:20px;margin:0 0 4px;}
  .login-shell p.sub{color:var(--ink-dim);font-size:13px;margin:0 0 24px;}
  .role-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px;}
  .role-toggle button{
    flex:1;padding:10px;background:var(--panel-2);color:var(--ink-dim);border:none;
    cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.5px;
  }
  .role-toggle button.active{background:var(--amber);color:#fff8ee;font-weight:700;}

  .person-pick{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:260px;overflow-y:auto;}
  .person-pick-btn{
    width:100%;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);font-size:14px;font-family:var(--sans);cursor:pointer;
  }
  .person-pick-btn.on{border-color:var(--amber);background:rgba(185,106,18,.12);font-weight:700;}

  label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;font-family:var(--mono);}
  select, input[type=password], input[type=text], input[type=date], input[type=email], input[type=number], textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    padding:10px 12px;border-radius:8px;font-size:14px;font-family:var(--sans);margin-bottom:16px;
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    background:var(--amber);color:#fff8ee;border:none;padding:11px 18px;
    border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--sans);
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600;}
  .btn.ghost:hover{border-color:var(--amber);color:var(--amber);}
  .btn.danger{background:var(--red);color:#fff5f4;}
  .btn.small{padding:6px 12px;font-size:12px;border-radius:6px;}
  .err{color:var(--red);font-size:13px;margin:-8px 0 16px;min-height:16px;}

  /* Cards / sections */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px;}
  .card h2{margin:0 0 4px;font-size:16px;}
  .card p.hint{color:var(--ink-dim);font-size:13px;margin:0 0 18px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tabs button{
    background:none;border:none;color:var(--ink-dim);padding:10px 16px;cursor:pointer;
    font-family:var(--mono);font-size:12.5px;letter-spacing:.3px;border-bottom:2px solid transparent;
    white-space:nowrap;flex-shrink:0;
  }
  .tabs button.active{color:var(--amber);border-bottom-color:var(--amber);}

  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  .table-scroll table{min-width:560px;}
  th{text-align:left;color:var(--ink-dim);font-family:var(--mono);font-weight:500;font-size:11px;
     text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:rgba(20,30,45,.03);}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:var(--mono);}
  .badge.ok{background:rgba(35,135,90,.12);color:var(--green);}
  .badge.warn{background:rgba(200,56,43,.12);color:var(--red);}
  .badge.soon{background:rgba(185,106,18,.14);color:var(--amber);}
  .badge.over{background:rgba(200,56,43,.18);color:var(--red);font-weight:800;}
  .badge.idle{background:rgba(102,112,133,.12);color:var(--ink-dim);}

  .item-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row .lbl{font-size:14px;}
  .ans-time{font-family:var(--mono);font-size:11px;color:var(--ink-dim);font-weight:400;white-space:nowrap;}
  .choice{display:flex;gap:6px;}
  .choice button{
    padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink-dim);cursor:pointer;font-size:12.5px;font-weight:700;font-family:var(--mono);
  }
  .choice button.sel-evet.on{background:rgba(35,135,90,.14);border-color:var(--green);color:var(--green);}
  .choice button.sel-hayir.on{background:rgba(200,56,43,.14);border-color:var(--red);color:var(--red);}

  .empty{color:var(--ink-dim);font-size:13px;text-align:center;padding:40px 0;font-family:var(--mono);}

  .form-list-item{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel-2);
    cursor:pointer;
  }
  .form-list-item:hover{border-color:var(--amber);}
  .form-list-item .meta{font-size:12px;color:var(--ink-dim);font-family:var(--mono);margin-top:2px;}

  .vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
  .vcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .vcard-plate{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:1px;}
  .vcard-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px;}
  .vcard-field{font-size:12px;color:var(--ink-dim);}
  .vcard-field b{display:block;color:var(--ink);font-size:13px;font-weight:600;margin-bottom:4px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .overlay .card{max-width:520px;width:100%;margin:20px 0;}
  .module-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .module-tabs button{
    flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink-dim);cursor:pointer;font-family:var(--mono);font-size:12.5px;letter-spacing:.4px;
  }
  .module-tabs button.active{background:var(--amber);color:#fff8ee;border-color:var(--amber);font-weight:700;}

  .builder-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .builder-row input[type=text]{margin:0;flex:1;}
  .builder-row select{margin:0;width:130px;}

  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;}
  .filters > div{min-width:150px;}
  .filters label{margin-bottom:4px;}
  .filters select, .filters input{margin-bottom:0;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--amber);color:var(--ink);
    padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(20,30,45,.15);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  @media (max-width:640px){
    .topbar{padding:12px 14px;flex-wrap:wrap;gap:8px;}
    .brand{font-size:13px;}
    .wrap{padding:16px 12px 60px;}
    .card{padding:16px;}
    .login-shell{padding:22px;margin-top:4vh;max-width:100%;}
    .item-row{flex-direction:column;align-items:flex-start;gap:10px;}
    .choice{width:100%;}
    .choice button{flex:1;padding:10px 8px;}
    .form-list-item{flex-direction:column;align-items:flex-start;gap:10px;}
    .form-list-item > div:last-child{width:100%;display:flex;flex-wrap:wrap;gap:8px;}
    .builder-row{flex-direction:column;align-items:stretch;gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;}
    .builder-row select, .builder-row input[type=text], .builder-row input[type=number], .builder-row button{width:100%;margin:0;}
    .filters{flex-direction:column;align-items:stretch;}
    .filters > div{min-width:0;width:100%;}
    .flex-between{flex-direction:column;align-items:stretch;}
    .flex-between .btn{width:100%;}
    .table-scroll table{min-width:480px;}
    .who{gap:8px;}
    .who button{padding:6px 9px;font-size:11px;}
    .tabs{overflow-x:auto;}
  }
  @media (max-width:400px){
    .login-shell{padding:18px;}
    .brand{font-size:11.5px;}
    .shift-row{flex-direction:column;gap:0 !important;}
  }
</style>

<script>
/* ============================================================
   BACKEND: Firebase Firestore
   Google Sheets/Apps Script yerine, tam olarak bu tür sık/küçük
   okuma-yazma işlemleri için tasarlanmış hızlı bir veritabanı.
   ============================================================ */
/* ▼▼▼ Firebase projenizin ayarları — Firebase Console > Proje Ayarları > "Web uygulaması" bölümünden alın ▼▼▼ */
const firebaseConfig = {
  apiKey: "AIzaSyAwj70TsOHnNg8-VuGdjfLjLOhG5RwvNQk",
  authDomain: "nkpv1-d68c3.firebaseapp.com",
  projectId: "nkpv1-d68c3",
  storageBucket: "nkpv1-d68c3.firebasestorage.app",
  messagingSenderId: "184725335779",
  appId: "1:184725335779:web:905ffb2661b2b13d3a9fd6"
};
/* ▲▲▲ */

/* ▼▼▼ EmailJS ayarları (Araç Takip modülünün mail bildirimleri için) —
   emailjs.com hesabınızdan alınır, bkz. PROJE_DOKUMANI.md ▼▼▼ */
const EMAILJS_PUBLIC_KEY = "YOUR_EMAILJS_PUBLIC_KEY";
const EMAILJS_SERVICE_ID = "YOUR_EMAILJS_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "YOUR_EMAILJS_TEMPLATE_ID";
/* ▲▲▲ */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
try{ emailjs.init({publicKey: EMAILJS_PUBLIC_KEY}); }catch(e){ console.error('EmailJS init hatası', e); }

/* Anonim oturum: kullanıcıya hiçbir giriş ekranı göstermez, arka planda sessizce
   çalışır. Firestore kuralları artık "allow if request.auth != null" olduğu için
   bu oturum kurulmadan hiçbir veri okunup yazılamaz — botlara/rastgele erişime
   karşı hafif bir engel. Gerçek kişi bazlı yetkilendirme değildir. */
function ensureAuth(){
  return new Promise((resolve)=>{
    const unsub = auth.onAuthStateChanged(user=>{
      if(user){ unsub(); resolve(user); }
    });
    auth.signInAnonymously().catch(err=>{
      console.error('Anonim oturum açılamadı', err);
      resolve(null);
    });
  });
}

const SITE_URL = window.location.origin + window.location.pathname; // sayfanın kendi gerçek adresi (QR linkleri için)
const SCAN_ITEM_ID = new URLSearchParams(window.location.search).get('cp') || '';

/* ---- basit anahtar/değer (personel listesi, form yapısı, admin şifresi) ----
   ÖNEMLİ: Burada hataları YUTMUYORUZ (try/catch yok). Sebebi: eğer bir okuma
   hatasını (izin hatası, ağ kopması vb.) "kayıt yok" ile aynı şekilde ele alırsak,
   loadCore() bunu "veritabanı boş" sanıp VARSAYILAN VERİYLE ÜZERİNE YAZABİLİR —
   gerçek personel/form/yönetici listesini silme riski doğar. Bunun yerine hata
   olduğunda yukarıya (loadCore'un try/catch'ine) fırlatılır; orada Firestore'a
   hiçbir şey YAZILMADAN sadece geçici/yerel varsayılanlarla devam edilir. */
async function kvGet(key, fallback){
  const doc = await db.collection('kv').doc(key).get();
  if(!doc.exists) return fallback;
  const v = doc.data().value;
  return v === undefined ? fallback : JSON.parse(v);
}
async function kvSet(key, value){
  try{ await db.collection('kv').doc(key).set({value: JSON.stringify(value)}); return true; }
  catch(e){ console.error('kvSet hatası', key, e); return false; }
}

/* ---- form gönderimleri ---- */
async function getSubmissionsRemote(){
  try{
    const snap = await db.collection('submissions').get();
    return snap.docs.map(d=>d.data());
  }catch(e){ console.error('getSubmissions hatası', e); return []; }
}
async function addSubmissionRemote(sub){
  try{ await db.collection('submissions').doc(sub.id).set(sub); return true; }
  catch(e){ console.error('addSubmission hatası', e); return false; }
}
async function deleteSubmissionsBeforeRemote(cutoff){
  try{
    let deleted = 0;
    const subsSnap = await db.collection('submissions').where('tarih', '<', cutoff).get();
    for(const d of subsSnap.docs){ await d.ref.delete(); deleted++; }
    const scansSnap = await db.collection('scans').where('tarih', '<', cutoff).get();
    for(const d of scansSnap.docs){ await d.ref.delete(); deleted++; }
    return {ok:true, deleted};
  }catch(e){ console.error('silme hatası', e); return {ok:false, deleted:0}; }
}

/* ---- araç bildirim (mail) geçmişi ---- */
async function getMailLogRemote(){
  try{
    const snap = await db.collection('at-mail-log').get();
    return snap.docs.map(d=>d.data());
  }catch(e){ console.error('getMailLog hatası', e); return []; }
}
async function addMailLogRemote(entry){
  try{ await db.collection('at-mail-log').doc(entry.id).set(entry); return true; }
  catch(e){ console.error('addMailLog hatası', e); return false; }
}
async function deleteMailLogsBeforeRemote(cutoffIso){
  try{
    let deleted = 0;
    const snap = await db.collection('at-mail-log').where('olusturulma', '<', cutoffIso).get();
    for(const d of snap.docs){ await d.ref.delete(); deleted++; }
    return {ok:true, deleted};
  }catch(e){ console.error('mail log silme hatası', e); return {ok:false, deleted:0}; }
}

/* ---- QR kontrol noktası taramaları ---- */
async function getScansRemote(){
  try{
    const snap = await db.collection('scans').get();
    // Eski kayıtlarda (bu güncellemeden önce eklenmiş) 'id' alanı saklanmamış olabilir —
    // böyle durumlarda Firestore'un kendi doküman kimliğini kullanarak tamamlıyoruz,
    // böylece tekil silme her kayıt için çalışır.
    return snap.docs.map(d=> ({...d.data(), id: d.data().id || d.id}));
  }catch(e){ console.error('getScans hatası', e); return []; }
}
async function logScanRemote(data){
  try{
    const id = uid('sc');
    await db.collection('scans').doc(id).set({...data, id});
    return true;
  }
  catch(e){ console.error('logScan hatası', e); return false; }
}
async function deleteScanRemote(scanId){
  try{ await db.collection('scans').doc(scanId).delete(); return true; }
  catch(e){ console.error('scan silme hatası', e); return false; }
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
/* Gece vardiyası gece yarısını geçtiği için "gün" kavramını takvim gününe değil
   VARDİYA gününe göre hesaplıyoruz: saat 08:00'den önceki her şey (gece yarısından
   sonraki saatler dahil) hâlâ "dünkü" vardiyaya ait sayılır. Böylece 19:00'da başlayıp
   07:00'de biten bir vardiyanın tüm kayıtları TEK bir tarihte toplanır. */
function todayStr(){
  const d = new Date();
  if(d.getHours() < 8){ d.setDate(d.getDate() - 1); }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function trDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

/* ============================================================
   ARAÇ TAKİP MODÜLÜ — sabitler, tarih yardımcıları, seed veri
   Nizamiye modülüyle AYNI personel/yönetici listelerini kullanır;
   ayrı bir kullanıcı sistemi YOKTUR (tek paket, tek giriş).
   ============================================================ */
function todayISOCalendar(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(iso+'T00:00:00');
  return Math.round((target - today) / 86400000);
}

/* ============================================================
   QR KONUM DOĞRULAMA — bir yönetici, kontrol noktasına GİTMEDEN,
   sadece kendi telefonundan "referans konum" tanımlayabilir; bu konum
   sabit koordinat olarak saklanır. Personel taradığında telefonun anlık
   konumu bu referansla kıyaslanır. İç mekanlarda GPS hassasiyeti düşük
   olabileceğinden bu bir UYARI'dır, taramayı engellemez.
   ============================================================ */
function haversineMetre(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getCurrentPositionSafe(timeoutMs){
  return new Promise((resolve)=>{
    if(!('geolocation' in navigator)){ resolve(null); return; }
    const timer = setTimeout(()=>resolve(null), timeoutMs || 6000);
    navigator.geolocation.getCurrentPosition(
      pos => { clearTimeout(timer); resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, dogruluk:pos.coords.accuracy}); },
      err => { clearTimeout(timer); resolve(null); },
      { enableHighAccuracy:true, timeout:(timeoutMs||6000), maximumAge:0 }
    );
  });
}
function remainingBadgeHtml(iso){
  if(!iso) return `<span class="badge idle">— tanımsız</span>`;
  const days = daysUntil(iso);
  let cls, lamp, label;
  if(days < 0){ cls='over'; lamp='warn'; label = `${trDate(iso)} · ${Math.abs(days)} gün gecikti`; }
  else if(days <= 7){ cls='warn'; lamp='warn'; label = `${trDate(iso)} · ${days} gün kaldı`; }
  else if(days <= 30){ cls='soon'; lamp='soon'; label = `${trDate(iso)} · ${days} gün kaldı`; }
  else { cls='ok'; lamp='ok'; label = `${trDate(iso)} · ${days} gün kaldı`; }
  return `<span class="badge ${cls}"><span class="lamp ${lamp}"></span> ${label}</span>`;
}

/* ============================================================
   ARAÇ TAKİP — MAIL GÖNDERİM MOTORU (EmailJS)
   ÖNEMLİ SINIRLAMA: Statik site + Firestore olduğu için gerçek bir sunucu/
   zamanlayıcı yoktur. Bildirimler yalnızca biri (personel ya da yönetici)
   panele giriş yaptığında kontrol edilip gönderilir. Panel günlerce
   açılmazsa, tekrar açıldığında birikmiş bildirimler tek seferde gider.
   Gerçek zamanlı otomasyon için Firebase Cloud Functions + zamanlanmış
   görev gerekir (bkz. PROJE_DOKUMANI.md).
   ============================================================ */
async function sendEmailJs(toEmail, toName, params){
  if(!toEmail) return false;
  try{
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: toEmail, to_name: toName || '', ...params
    });
    return true;
  }catch(e){ console.error('EmailJS gönderim hatası', e); return false; }
}
function collectVehicleRecipients(vehicle){
  const list = [];
  const sorumlu = State.personel.find(p=>p.id===vehicle.sorumluId);
  if(sorumlu && sorumlu.email) list.push({email:sorumlu.email, name:sorumlu.name});
  State.admins.forEach(a=>{ if(a.email) list.push({email:a.email, name:a.name}); });
  const seen = new Set();
  return list.filter(r=>{ if(seen.has(r.email)) return false; seen.add(r.email); return true; });
}
async function sendVehicleMail(vehicle, {tur, alan, hedefTarih, konu, detay}){
  const recipients = collectVehicleRecipients(vehicle);
  const logBase = {
    id: uid('m'), aracId: vehicle.id, plaka: vehicle.plaka, tur,
    alan: alan || null, hedefTarih: (hedefTarih === undefined ? null : hedefTarih),
    konu, olusturulma: new Date().toISOString(),
  };
  if(recipients.length === 0){
    const entry = {...logBase, aliciListesi:[], basarili:false, hata:'Alıcı e-postası tanımlı değil (Personel/Yöneticiler sekmesinden e-posta girin).'};
    await addMailLogRemote(entry);
    State.mailLog.push(entry);
    return false;
  }
  let allOk = true;
  for(const r of recipients){
    const ok = await sendEmailJs(r.email, r.name, {
      subject: konu, plaka: vehicle.plaka, marka_model: vehicle.markaModel || '',
      detay, tarih: trDate(todayISOCalendar()), panel_link: SITE_URL,
    });
    if(!ok) allOk = false;
    await new Promise(res=>setTimeout(res, 350));
  }
  const finalLog = {...logBase, aliciListesi: recipients.map(r=>r.email), basarili: allOk};
  await addMailLogRemote(finalLog);
  State.mailLog.push(finalLog);
  return allOk;
}
async function checkExpiryNotifications(){
  if(!State.aracAyarlar.mailBildirimAktif) return;
  if(State.notifChecked) return;
  State.notifChecked = true;
  const esikler = State.aracAyarlar.esikler || {};
  for(const v of State.araclar){
    if(!v.aktif) continue;
    for(const alan of DATE_FIELDS){
      const iso = v[alan.key];
      if(!iso) continue;
      const esik = (esikler[alan.key] !== undefined && esikler[alan.key] !== null) ? esikler[alan.key] : 30;
      const kalan = daysUntil(iso);
      if(kalan <= esik){
        // Aynı tarih değeri için daha önce mail gittiyse tekrar gönderme.
        // Tarih güncellenirse (örn. muayene yenilendiyse) yeni bir bildirim döngüsü başlar.
        const already = State.mailLog.some(m=>m.aracId===v.id && m.alan===alan.key && m.hedefTarih===iso);
        if(!already){
          const konu = `${v.plaka} — ${alan.label} ${kalan<0?'süresi geçti':'yaklaşıyor'}`;
          const detay = kalan<0
            ? `${alan.label} tarihi ${Math.abs(kalan)} gün önce geçti (${trDate(iso)}).`
            : `${alan.label} tarihine ${kalan} gün kaldı (${trDate(iso)}) — uyarı eşiği: ${esik} gün.`;
          await sendVehicleMail(v, {tur:'sure', alan:alan.key, hedefTarih:iso, konu, detay});
        }
      }
    }
  }
}
async function maybeSendDurumMail(oldVehicle, newVehicle){
  if(!State.aracAyarlar.mailBildirimAktif) return;
  if(!ALERT_DURUMLAR.has(newVehicle.durum)) return;
  if(oldVehicle && oldVehicle.durum === newVehicle.durum) return;
  const konu = `${newVehicle.plaka} — Durum değişti: ${newVehicle.durum}`;
  const detay = `${newVehicle.plaka} (${newVehicle.markaModel||'—'}) aracının durumu "${oldVehicle ? oldVehicle.durum : '—'}" iken "${newVehicle.durum}" olarak güncellendi.`;
  await sendVehicleMail(newVehicle, {tur:'durum', alan:null, konu, detay});
}
async function manualSendReminderMail(vehicle){
  const parts = DATE_FIELDS.map(a=>{
    const iso = vehicle[a.key]; if(!iso) return null;
    const kalan = daysUntil(iso);
    return `${a.label}: ${trDate(iso)} (${kalan<0 ? Math.abs(kalan)+' gün gecikti' : kalan+' gün kaldı'})`;
  }).filter(Boolean).join(' · ');
  const konu = `${vehicle.plaka} — Araç Bilgilendirme (elle gönderildi)`;
  return sendVehicleMail(vehicle, {tur:'manuel', alan:null, konu, detay: parts || 'Tanımlı tarih yok.'});
}

  const saved = loadSavedSession();

    const p = State.personel.find(x=>x.id===saved.personelId);

}

    // Sadece nizamiye yetkisi var — araç sekmesi hiç gösterilmez (eski davranışla birebir aynı).
    app.innerHTML = `<div id="personelBody"></div>`;
    renderPersonelFormlar();
  } else {
    app.innerHTML = `<div class="card"><div class="empty">Hesabınıza henüz bir modül ataması yapılmamış. Yöneticinizle iletişime geçin.</div></div>`;
  }
}

function renderFillForm(formId){
  const f = State.forms.find(x=>x.id===formId);
  const tarih = todayStr();
  const existing = findSubmission(formId, State.session.personelId, tarih);
  const answers = existing ? JSON.parse(JSON.stringify(existing.answers)) : {};
  const recordId = existing ? existing.id : uid('s');

  app.innerHTML = `
    <button class="btn ghost small" id="backBtn">← Form Listesi</button>
    <div class="card" style="margin-top:14px;">
      <h2>${f.title}</h2>
      <p class="hint">${trDate(tarih)} · ${State.session.name}</p>
      <div id="saveStatus" style="font-size:12px;color:var(--ink-dim);font-family:var(--mono);margin-bottom:10px;min-height:16px;"></div>
      <div id="itemsWrap"></div>
      <div id="doneBanner" style="display:none;margin-top:16px;padding:14px 16px;border-radius:8px;background:rgba(35,135,90,.12);border:1px solid var(--green);color:var(--green);font-weight:700;"></div>
      <div style="margin-top:18px;display:flex;gap:10px;">
        <button class="btn" id="submitBtn">Formu Gönder</button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=>{ personelOpenFormId=null; render(); };

  const statusEl = document.getElementById('saveStatus');
  let saveTimer = null;
  function scheduleAutosave(){
    statusEl.textContent = '● Kaydediliyor…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      const record = {
        id: recordId, formId: f.id, formTitle: f.title,
        personelId: State.session.personelId, personelName: State.session.name,
        tarih, answers, olusturulma: new Date().toISOString(),
        tamamlandiMi: existing ? !!existing.tamamlandiMi : false,
        tamamlanmaSaati: existing ? (existing.tamamlanmaSaati || null) : null,
      };
      const ok = await addSubmissionRemote(record);
      if(ok){
        if(existing){ State.submissions = State.submissions.map(s=>s.id===recordId?record:s); }
        else if(!State.submissions.find(s=>s.id===recordId)){ State.submissions.push(record); }
        else { State.submissions = State.submissions.map(s=>s.id===recordId?record:s); }
        statusEl.textContent = '✓ Otomatik kaydedildi — sekmeyi kapatıp tekrar açsanız bile kaldığınız yerden devam eder.';
      } else {
        statusEl.textContent = '⚠ Kaydedilemedi, bağlantı sorunu olabilir. İnternet bağlantınızı kontrol edin.';
      }
    }, 900);
  }

  const wrap = document.getElementById('itemsWrap');
  function timeTag(id){
    const t = answerTime(answers[id]);
    return t ? `<span class="ans-time" data-time-for="${id}">🕐 ${formatTime(t)}</span>` : `<span class="ans-time" data-time-for="${id}"></span>`;
  }

  wrap.innerHTML = f.items.map(item=>{
    if(item.type === 'baslik'){
      return `<div style="margin:18px 0 6px;font-family:var(--mono);font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;">${item.label}</div>`;
    }
    if(item.type === 'not'){
      const val = answerValue(answers[item.id]);
      return `
        <div class="item-row" style="flex-direction:column;align-items:stretch;" data-id="${item.id}">
          <label style="margin-bottom:8px;display:flex;justify-content:space-between;">${item.label} ${timeTag(item.id)}</label>
          <textarea rows="3" data-id="${item.id}" class="note-input" placeholder="Varsa notunuzu yazın...">${val||''}</textarea>
        </div>`;
    }
    if(item.type === 'qr_nokta'){
      const todaysScans = State.scans
        .filter(s=>s.itemId===item.id && s.tarih===tarih)
        .sort((a,b)=> a.saat.localeCompare(b.saat));
      const period = item.periodMinutes || 60;
      const scanListHtml = todaysScans.length
        ? todaysScans.map(s=>`<div style="font-size:12px;color:var(--ink-dim);padding:2px 0;">🕐 ${formatTime(s.saat)} · ${s.personelName}</div>`).join('')
        : `<div style="font-size:12px;color:var(--ink-dim);">Bugün henüz taranmadı.</div>`;
      return `
        <div class="item-row" style="flex-direction:column;align-items:stretch;" data-id="${item.id}" data-itemid="${item.id}">
          <label style="margin-bottom:4px;">${item.label}</label>
          <div style="font-size:11px;color:var(--ink-dim);margin-bottom:8px;">Beklenen periyot: her ${period} dakikada bir</div>
          <div class="qr-status">${scanListHtml}</div>
          <div class="hint" style="margin:8px 0 0;">Bu noktadaki QR etiketini telefonunuzun <b>kendi kamera uygulamasıyla</b> okutun — açılan sayfada onaylayın. Onayladıktan sonra buraya dönüp aşağıdan yenileyin.</div>
          <button class="btn ghost small qr-refresh-btn" data-id="${item.id}" style="margin-top:8px;align-self:flex-start;">🔄 Durumu Yenile</button>
        </div>`;
    }
    // evethayir
    const cur = answerValue(answers[item.id]);
    return `
      <div class="item-row" data-id="${item.id}">
        <div class="lbl">${item.label}<br>${timeTag(item.id)}</div>
        <div class="choice">
          <button class="sel-evet ${cur==='EVET'?'on':''}" data-val="EVET">EVET</button>
          <button class="sel-hayir ${cur==='HAYIR'?'on':''}" data-val="HAYIR">HAYIR</button>
        </div>
      </div>`;
  }).join('');

  wrap.querySelectorAll('.item-row[data-id] .choice button').forEach(btn=>{
    btn.onclick = ()=>{
      const row = btn.closest('.item-row');
      const id = row.dataset.id;
      const now = new Date().toISOString();
      answers[id] = {v: btn.dataset.val, t: now};
      row.querySelectorAll('.choice button').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      const tEl = row.querySelector(`[data-time-for="${id}"]`);
      if(tEl) tEl.textContent = `🕐 ${formatTime(now)}`;
      scheduleAutosave();
    };
  });
  wrap.querySelectorAll('.note-input').forEach(ta=>{
    ta.oninput = ()=>{
      const id = ta.dataset.id;
      const now = new Date().toISOString();
      answers[id] = {v: ta.value, t: now};
      const row = ta.closest('.item-row');
      const tEl = row.querySelector(`[data-time-for="${id}"]`);
      if(tEl) tEl.textContent = ta.value.trim() ? `🕐 ${formatTime(now)}` : '';
      scheduleAutosave();
    };
  });
  wrap.querySelectorAll('.qr-refresh-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      btn.textContent = 'Yenileniyor…';
      State.scans = await getScansRemote();
      btn.disabled = false;
      btn.textContent = '🔄 Durumu Yenile';
      const row = btn.closest('.item-row');
      const itemId = row.dataset.itemid;
      const todaysScans = State.scans
        .filter(s=>s.itemId===itemId && s.tarih===tarih)
        .sort((a,b)=> a.saat.localeCompare(b.saat));
      const statusEl = row.querySelector('.qr-status');
      statusEl.innerHTML = todaysScans.length
        ? todaysScans.map(s=>`<div style="font-size:12px;color:var(--ink-dim);padding:2px 0;">🕐 ${formatTime(s.saat)} · ${s.personelName}</div>`).join('')
        : `<div style="font-size:12px;color:var(--ink-dim);">Bugün henüz taranmadı.</div>`;
    };
  });

  document.getElementById('submitBtn').onclick = async ()=>{
    const btn = document.getElementById('submitBtn');
    const record = {
      id: recordId, formId: f.id, formTitle: f.title,
      personelId: State.session.personelId, personelName: State.session.name,
      tarih, answers, olusturulma: new Date().toISOString(),
      tamamlandiMi: true, tamamlanmaSaati: new Date().toISOString(),
    };
    btn.disabled = true;
    btn.textContent = 'Gönderiliyor…';
    const ok = await addSubmissionRemote(record);
    btn.disabled = false;
    btn.textContent = 'Formu Gönder';
    const banner = document.getElementById('doneBanner');
    if(!ok){
      toast('⚠ Form KAYDEDİLEMEDİ — bağlantı sorunu olabilir. Lütfen tekrar deneyin.');
      banner.style.display = 'block';
      banner.style.background = 'rgba(200,56,43,.12)';
      banner.style.borderColor = 'var(--red)';
      banner.style.color = 'var(--red)';
      banner.textContent = '⚠ Form kaydedilemedi. Lütfen tekrar deneyin.';
      return;
    }
    if(existing || State.submissions.find(s=>s.id===recordId)){
      State.submissions = State.submissions.map(s=>s.id===recordId?record:s);
    } else {
      State.submissions.push(record);
    }
    toast('✓ Form gönderildi.');
    banner.style.display = 'block';
    banner.textContent = `✓ Form gönderildi — ${formatTime(new Date().toISOString())}`;
    setTimeout(()=>{ personelOpenFormId = null; render(); }, 1400);
  };
}

function submissionStatus(sub){
  const form = State.forms.find(f=>f.id===sub.formId);
  let hayirCount = 0, note = '';
  if(form){
    form.items.forEach(item=>{
      const v = answerValue(sub.answers[item.id]);
      if(item.type==='evethayir' && v==='HAYIR') hayirCount++;
      if(item.type==='qr_nokta' && !findLatestScan(item.id, sub.tarih)) hayirCount++;
      if(item.type==='not' && (v||'').trim()) note += (v+' ');
    });
  }
  const status = (hayirCount>0 || note.trim()) ? 'DİKKAT' : 'TAMAM';
  return {hayirCount, note: note.trim(), status};
}

/* ---------- Kapsama Kontrolü: hiç doldurulmamış olabilecek günleri bulur ---------- */
function isoRangeList(startIso, endIso){
  const out = [];
  let d = new Date(startIso+'T00:00:00');
  const end = new Date(endIso+'T00:00:00');
  while(d <= end){
    out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    d.setDate(d.getDate()+1);
  }
  return out;
}
function showCoverageCheck(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const defaultEnd = todayStr();
  const defaultStartDate = new Date(defaultEnd+'T00:00:00'); defaultStartDate.setDate(defaultStartDate.getDate()-6);
  const defaultStart = defaultStartDate.getFullYear()+'-'+String(defaultStartDate.getMonth()+1).padStart(2,'0')+'-'+String(defaultStartDate.getDate()).padStart(2,'0');
  overlay.innerHTML = `
    <div class="card" style="max-width:560px;">
      <h2>📋 Kapsama Kontrolü</h2>
      <p class="hint">Seçilen form ve tarih aralığında, o form için <b>hiç gönderim kaydı bulunmayan</b> (muhtemelen kimsenin doldurmadığı) günleri listeler. Bugünün vardiyası ve gelecek tarihler hariç tutulur (henüz sürmekte olabilir).</p>
      <label>Form</label>
      <select id="covForm">
        ${State.forms.map(f=>`<option value="${f.id}">${f.title}</option>`).join('')}
      </select>
      <div style="display:flex;gap:12px;">
        <div style="flex:1;"><label>Başlangıç</label><input type="date" id="covStart" value="${defaultStart}"></div>
        <div style="flex:1;"><label>Bitiş</label><input type="date" id="covEnd" value="${defaultEnd}"></div>
      </div>
      <button class="btn small" id="covRunBtn">Kontrol Et</button>
      <div id="covResult" style="margin-top:16px;"></div>
      <div style="margin-top:16px;">
        <button class="btn ghost" id="covCloseBtn">Kapat</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('covCloseBtn').onclick = ()=> overlay.remove();
  document.getElementById('covRunBtn').onclick = ()=>{
    const formId = document.getElementById('covForm').value;
    const start = document.getElementById('covStart').value;
    const end = document.getElementById('covEnd').value;
    const resultEl = document.getElementById('covResult');
    if(!formId || !start || !end){ toast('Form ve tarih aralığı seçin.'); return; }
    if(start > end){ toast('Başlangıç, bitişten sonra olamaz.'); return; }
    const today = todayStr();
    const dates = isoRangeList(start, end).filter(d => d < today); // bugün ve ileri tarihler hariç
    const existing = new Set(State.submissions.filter(s=>s.formId===formId).map(s=>s.tarih));
    const missing = dates.filter(d => !existing.has(d));
    if(dates.length === 0){
      resultEl.innerHTML = `<div class="empty">Seçilen aralıkta değerlendirilecek geçmiş gün yok.</div>`;
    } else if(missing.length === 0){
      resultEl.innerHTML = `<div style="padding:14px 16px;border-radius:8px;background:rgba(35,135,90,.12);border:1px solid var(--green);color:var(--green);font-weight:700;">✓ ${dates.length} günün hepsi için kayıt bulundu — eksik gün yok.</div>`;
    } else {
      resultEl.innerHTML = `
        <div style="padding:14px 16px;border-radius:8px;background:rgba(200,56,43,.1);border:1px solid var(--red);color:var(--red);font-weight:700;margin-bottom:10px;">
          ⚠ ${missing.length} / ${dates.length} günde hiç kayıt bulunamadı:
        </div>
        <div class="table-scroll"><table><tbody>
          ${missing.sort().reverse().map(d=>`<tr><td style="font-family:var(--mono);">${trDate(d)}</td></tr>`).join('')}
        </tbody></table></div>
      `;
    }
  };
}

/* ---------- QR TURLARI (ana formdan bağımsız, dönemsel devriye günlüğü) ---------- */
let qFilterDate = todayStr();

/* "HH:MM" - "HH:MM" arası vardiya süresini dakika olarak hesaplar (gece yarısını geçebilir) */
function shiftDurationMinutes(shiftStart, shiftEnd){
  const [sh, sm] = (shiftStart||'19:00').split(':').map(Number);
  const [eh, em] = (shiftEnd||'07:00').split(':').map(Number);
  let startMin = sh*60 + sm;
  let endMin = eh*60 + em;
  if(endMin <= startMin) endMin += 24*60; // gece yarısını geçiyor
  return endMin - startMin;
}

function allQrItemsAcrossForms(){
  const out = [];
  State.forms.forEach(f=>{
    const shiftStart = f.shiftStart || '19:00';
    const shiftEnd = f.shiftEnd || '07:00';
    f.items.forEach(item=>{
      if(item.type === 'qr_nokta') out.push({...item, formTitle: f.title, shiftStart, shiftEnd});
    });
  });
  return out;
}

function renderQrTurlariTab(){
  const canEdit = isFullAdmin();
  const body = document.getElementById('adminBody');
  body.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <h2 style="margin:0;">QR Turları</h2>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost small" id="printQrBtn">🖨 PDF Yap</button>
          <button class="btn ghost small" id="refreshQrBtn">🔄 Yenile</button>
        </div>
      </div>
      <p class="hint">Her kontrol noktasının seçilen gündeki tüm taramaları — form doldurulmuş olsun ya da olmasın burada görünür.</p>
      <div class="filters" style="margin-bottom:18px;">
        <div><label>Tarih</label><input type="date" id="qDate" value="${qFilterDate}"></div>
      </div>
      <div id="qrTurWrap"></div>
    </div>
  `;
  document.getElementById('qDate').onchange = e=>{ qFilterDate = e.target.value; renderQrTurlariTab(); };
  document.getElementById('refreshQrBtn').onclick = async ()=>{
    const btn = document.getElementById('refreshQrBtn');
    btn.disabled = true; btn.textContent = 'Yenileniyor…';
    await loadActivityData();
    renderQrTurlariTab();
  };
  document.getElementById('printQrBtn').onclick = ()=>{
    const qrItemsForPrint = allQrItemsAcrossForms();
    if(qrItemsForPrint.length===0){ toast('Yazdırılacak QR noktası yok.'); return; }
    const sections = qrItemsForPrint.map(item=>{
      const scans = State.scans.filter(s=>s.itemId===item.id && s.tarih===qFilterDate).sort((a,b)=>a.saat.localeCompare(b.saat));
      const period = item.periodMinutes || 60;
      const expected = Math.max(1, Math.round(shiftDurationMinutes(item.shiftStart, item.shiftEnd) / period));
      const rows = scans.length
        ? scans.map(s=>`<div class="row"><span>🕐 ${formatTime(s.saat)} · ${s.personelName}</span></div>`).join('')
        : `<div class="row"><span>Tarama yok</span></div>`;
      return `<h2>${item.label} — ${scans.length} / ${expected} tur</h2>
        <div class="meta">${item.formTitle} · Vardiya ${item.shiftStart}–${item.shiftEnd} · Periyot: ${period} dk</div>
        ${rows}`;
    }).join('');
    printHtmlDocument('QR Turları', `<h1>QR Turları — ${trDate(qFilterDate)}</h1>${sections}`);
  };

  const wrap = document.getElementById('qrTurWrap');
  const qrItems = allQrItemsAcrossForms();
  if(qrItems.length===0){
    wrap.innerHTML = `<div class="empty">Henüz tanımlı QR kontrol noktası yok. Formlar sekmesinden ekleyebilirsiniz.</div>`;
    return;
  }

  wrap.innerHTML = qrItems.map(item=>{
    const scans = State.scans
      .filter(s=>s.itemId===item.id && s.tarih===qFilterDate)
      .sort((a,b)=> a.saat.localeCompare(b.saat));
    const period = item.periodMinutes || 60;
    const shiftMin = shiftDurationMinutes(item.shiftStart, item.shiftEnd);
    const expectedRounds = Math.max(1, Math.round(shiftMin / period));
    const complete = scans.length >= expectedRounds;

    let rowsHtml = '';
    if(scans.length===0){
      rowsHtml = `<div class="empty" style="padding:14px 0;">Bu gün için henüz tarama yok.</div>`;
    } else {
      rowsHtml = scans.map((s,idx)=>{
        let gapWarning = '';
        if(idx > 0){
          const prevMs = new Date(scans[idx-1].saat).getTime();
          const curMs = new Date(s.saat).getTime();
          const gapMin = Math.round((curMs - prevMs) / 60000);
          if(gapMin > period * 1.5){
            gapWarning = `<span class="badge warn" style="margin-left:8px;"><span class="lamp warn"></span> ${formatTime(scans[idx-1].saat)} → ${formatTime(s.saat)} arası ${gapMin} dk boşluk</span>`;
          }
        }
        const locWarning = s.konumUyari ? `<span class="badge over" style="margin-left:8px;" title="Bu telefonun taradığı anki konumu, noktaya tanımlı referans konumdan ~${s.mesafeMetre}m uzaktaydı.">📍 Konum uyuşmuyor (~${s.mesafeMetre}m)</span>` : '';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap;gap:4px;">
          <span>🕐 ${formatTime(s.saat)} · ${s.personelName}</span>
          <span style="display:flex;align-items:center;gap:6px;">${gapWarning}${locWarning}${canEdit ? `<button class="btn danger small" data-delscan="${s.id}" title="Bu taramayı sil (örn. test kaydı)">Sil</button>` : ''}</span>
        </div>`;
      }).join('');
    }

    return `
      <div class="card" style="background:var(--panel-2);margin-bottom:14px;">
        <div class="flex-between" style="margin-bottom:6px;">
          <div>
            <b>${item.label}</b>
            <div class="meta" style="font-size:12px;color:var(--ink-dim);">
              ${item.formTitle} · Vardiya ${item.shiftStart}–${item.shiftEnd} · Periyot: ${period} dk · Beklenen: ~${expectedRounds} tur
            </div>
          </div>
          <span class="badge ${complete?'ok':'warn'}">${scans.length} / ${expectedRounds} tur</span>
        </div>
        ${rowsHtml}
      </div>
    `;
  }).join('');

  // TEŞHİS: mevcut hiçbir noktaya ait olmayan (muhtemelen eski/silinmiş QR etiketinden gelen) taramalar
  const knownIds = new Set(qrItems.map(i=>i.id));
  const orphanScans = State.scans.filter(s=> s.tarih===qFilterDate && !knownIds.has(s.itemId));
  if(orphanScans.length > 0){
    wrap.innerHTML += `
      <div class="card" style="background:rgba(200,56,43,.06);border-color:var(--red);margin-top:6px;">
        <h3 style="margin:0 0 6px;color:var(--red);">⚠ Eşleşmeyen Taramalar (${orphanScans.length})</h3>
        <p class="hint">Bu taramalar kaydedildi ama yukarıdaki hiçbir noktanın kimliğiyle eşleşmiyor — muhtemelen form düzenlenirken o noktanın kimliği değişti. Muhtemel çözüm: bu etiketi çöpe atıp o noktanın QR'ını Formlar'dan yeniden yazdırın.</p>
        ${orphanScans.map(s=>`
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);padding:4px 0;border-bottom:1px dashed var(--line);">
            <span>🕐 ${formatTime(s.saat)} · ${s.personelName} · "<b>${s.checkpointLabel}</b>" · kimlik: <code>${s.itemId}</code></span>
            ${canEdit ? `<button class="btn danger small" data-delscan="${s.id}">Sil</button>` : ''}
          </div>
        `).join('')}
      </div>
    `;
  }

  if(canEdit){
    wrap.querySelectorAll('button[data-delscan]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Bu tek taramayı kalıcı olarak silmek istediğinize emin misiniz? (Örn. bir test kaydı.) Bu işlem geri alınamaz.')) return;
        b.disabled = true; b.textContent = 'Siliniyor…';
        const ok = await deleteScanRemote(b.dataset.delscan);
        if(ok){
          State.scans = State.scans.filter(s=>s.id!==b.dataset.delscan);
          toast('✓ Tarama silindi.');
          renderQrTurlariTab();
        } else {
          b.disabled = false; b.textContent = 'Sil';
          toast('⚠ Silinemedi, bağlantınızı kontrol edin.');
        }
      };
    });
  }
}

/* ---------- PDF/Yazdırma yardımcıları ---------- */
function printHtmlDocument(title, bodyHtml){
  const w = window.open('', '_blank');
  if(!w){ toast('Pop-up engellendi — tarayıcının adres çubuğundaki pop-up simgesine tıklayıp izin verin.'); return; }
  w.document.write(`
    <html><head><title>${title}</title>
    <style>
      body{font-family:Arial,sans-serif;color:#1b2430;padding:24px;}
      h1{font-size:19px;margin:0 0 4px;}
      h2{font-size:14px;margin:20px 0 6px;color:#b96a12;text-transform:uppercase;letter-spacing:.3px;}
      .meta{color:#667085;font-size:12px;margin-bottom:16px;}
      table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12.5px;}
      th,td{border:1px solid #ddd;padding:6px 8px;text-align:left;}
      th{background:#f2f3f5;}
      .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #ddd;font-size:13px;}
      .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;}
      .ok{background:#e6f4ec;color:#1c7a4c;}
      .warn{background:#fdeceb;color:#b1382c;}
      @media print { body{padding:0;} }
    </style>
    </head><body>${bodyHtml}</body></html>
  `);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 300);
}

/* Tek bir gönderimi yazdırmaya uygun (CSS değişkeni kullanmayan) HTML üretir */
function buildSubmissionPrintBody(sub){
  const form = State.forms.find(f=>f.id===sub.formId);
  const st = submissionStatus(sub);
  let itemsHtml = '';
  if(form){
    itemsHtml = form.items.map(item=>{
      if(item.type==='baslik') return `<h2>${item.label}</h2>`;
      const val = answerValue(sub.answers[item.id]);
      const t = answerTime(sub.answers[item.id]);
      const timeStr = t ? `🕐 ${formatTime(t)}` : '';
      if(item.type==='not'){
        return `<div class="row"><span><b>${item.label}:</b> ${val && val.trim() ? val : '(boş)'}</span><span>${timeStr}</span></div>`;
      }
      if(item.type==='qr_nokta'){
        const scan = findLatestScan(item.id, sub.tarih);
        return `<div class="row"><span>${item.label}</span><span>${scan ? `🕐 ${formatTime(scan.saat)} · ${scan.personelName} · ✓ Doğrulandı` : 'Taranmadı'}</span></div>`;
      }
      return `<div class="row"><span>${item.label}</span><span>${timeStr} ${val||'—'}</span></div>`;
    }).join('');
  }
  const gonderimStr = sub.tamamlandiMi
    ? `Gönderildi: ${formatTime(sub.tamamlanmaSaati)}`
    : `⚠ Hiç gönderilmedi (son otomatik kayıt: ${formatTime(sub.olusturulma)})`;
  return `
    <h1>${sub.formTitle}</h1>
    <div class="meta">${trDate(sub.tarih)} · ${sub.personelName} · Durum: <b>${st.status}</b> · ${gonderimStr}</div>
    ${itemsHtml}
  `;
}

function renderSubmissionDetail(sub){

      ${form.items.map(item=>{

        const val = answerValue(sub.answers[item.id]);
        const t = answerTime(sub.answers[item.id]);
        const timeStr = t ? `<span class="ans-time">🕐 ${formatTime(t)}</span>` : '';
        if(item.type==='not'){
          return `<div style="font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;"><span><b>${item.label}:</b> ${val && val.trim() ? val : '<span style="color:var(--ink-dim);">(boş)</span>'}</span>${timeStr}</div>`;

          return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);">
            <span>${item.label}</span>
            <span style="display:flex;align-items:center;gap:8px;">
              ${scan ? `<span class="ans-time">🕐 ${formatTime(scan.saat)} · ${scan.personelName}</span><span style="color:var(--green);font-weight:700;">✓ DOĞRULANDI</span>${locWarn}` : '<span style="color:var(--red);font-weight:700;">TARANMADI</span>'}
            </span>
          </div>`;
        }
        const cls = val==='HAYIR' ? 'color:var(--red);font-weight:700;' : (val==='EVET' ? 'color:var(--green);font-weight:700;' : 'color:var(--ink-dim);');
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);">
          <span>${item.label}</span>
          <span style="display:flex;align-items:center;gap:8px;">${timeStr}<span style="${cls}">${val||'—'}</span></span>
        </div>`;
      }).join('')}

  `;
}

/* ---------- Formdaki tüm QR noktalarını tek sayfada yazdırma ---------- */
/* Güvenilir, iyi test edilmiş kütüphaneyle (qrcode-generator) veri URL'si üretir.
   NOT: Bu kütüphanenin otomatik boyut algılama (typeNumber=0) özelliği belirli
   metin uzunluklarında hatalıydı — bunun yerine sığan boyutu elle deniyoruz. */
function makeQrDataUrl(text, cellSize){
  // Önce otomatik boyut algılamayı dene (güncel kütüphanede düzgün çalışıyor)
  try{
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createDataURL(cellSize || 6, 8);
  }catch(e){ /* devam, elle dene */ }

  let lastErr = null;
  for(let type=1; type<=40; type++){
    try{
      const qr = qrcode(type, 'M');
      qr.addData(text);
      qr.make();
      return qr.createDataURL(cellSize || 6, 8);
    }catch(e){ lastErr = e; }
  }
  throw new Error(`QR üretilemedi (${text.length} karakter). Son hata: ${lastErr ? (lastErr.message || lastErr) : 'bilinmiyor'}`);
}

function printAllQrCodes(form){
  const qrItems = form.items.filter(i=>i.type==='qr_nokta');
  if(qrItems.length===0){ toast('Bu formda QR kontrol noktası yok.'); return; }

  let tags;
  try{
    tags = qrItems.map(item=>({
      label: item.label,
      dataUrl: makeQrDataUrl(`${SITE_URL}?cp=${encodeURIComponent(item.id)}`, 6)
    }));
  }catch(e){
    console.error('QR üretme hatası', e);
    toast('QR üretilirken bir hata oluştu: ' + e.message);
    return;
  }

  const w = window.open('', '_blank');
  if(!w){ toast('Pop-up engellendi — tarayıcının adres çubuğundaki pop-up simgesine tıklayıp izin verin.'); return; }
  w.document.write(`
    <html><head><title>${form.title} — QR Etiketleri</title>
    <style>
      body{font-family:sans-serif;}
      .grid{display:flex;flex-wrap:wrap;gap:24px;}
      .tag{width:220px;text-align:center;border:1px dashed #999;padding:16px;page-break-inside:avoid;}
      .tag img{width:200px;height:200px;}
    </style>
    </head><body>
    <h2>${form.title} — QR Etiketleri</h2>
    <div class="grid">
      ${tags.map(t=>`<div class="tag"><h3>${t.label}</h3><img src="${t.dataUrl}"></div>`).join('')}
    </div>
    </body></html>
  `);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 300);
}

/* ---------- QR kodu görüntüleme / yazdırma (kontrol noktası etiketi) ---------- */
function showQrPrintView(item){
  const scanUrl = `${SITE_URL}?cp=${encodeURIComponent(item.id)}`;
  let dataUrl;
  try{
    dataUrl = makeQrDataUrl(scanUrl, 6);
  }catch(e){
    console.error('QR üretme hatası', e);
    toast('QR üretilirken bir hata oluştu: ' + e.message);
    return;
  }
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="card" style="max-width:360px;width:100%;margin:0;text-align:center;">
      <h2>${item.label || 'Kontrol Noktası'}</h2>
      <div id="qrImgHolder" style="display:flex;justify-content:center;margin:16px 0;">
        <img src="${dataUrl}" width="200" height="200">
      </div>
      <p class="hint">Bu etiketi yazdırıp ilgili kontrol noktasına yapıştırın. Personel, telefonunun <b>kendi kamera uygulamasıyla</b> bu etiketi okutacak.</p>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button class="btn" id="qrPrintBtn">Yazdır</button>
        <button class="btn ghost" id="qrCloseBtn">Kapat</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('qrCloseBtn').onclick = ()=> overlay.remove();
  document.getElementById('qrPrintBtn').onclick = ()=>{
    const w = window.open('', '_blank');
    if(!w){ toast('Pop-up engellendi — tarayıcının adres çubuğundaki pop-up simgesine tıklayıp izin verin.'); return; }
    w.document.write(`
      <html><head><title>${item.label}</title></head>
      <body style="text-align:center;font-family:sans-serif;padding:40px;">
        <h2>${item.label}</h2>
        <img src="${dataUrl}" width="200" height="200">
      </body></html>
    `);
    w.document.close();
    w.focus();
    setTimeout(()=>w.print(), 300);
  };
}

function personGorevBadges(p){
  const niz = p.gorevNizamiye !== false;
  const arac = p.gorevArac !== false;
  let out = '';
  if(niz) out += `<span class="badge ok" style="margin-right:4px;">NİZAMİYE</span>`;
  if(arac) out += `<span class="badge soon">ARAÇ TAKİP</span>`;
  if(!niz && !arac) out += `<span class="badge idle">Hiçbiri</span>`;
  return out;
}

      telefon: document.getElementById('pTel').value.trim(),

    await kvSet('guv-personel', State.personel);
    overlay.remove();
    toast('Personel kaydedildi.');
    renderPersonelTab();
  };
}

function findItemById(itemId){
  for(const f of State.forms){
    const item = f.items.find(i=>i.id===itemId);
    if(item) return item;
  }
  return null;
}

function rememberedPersonelId(){
  try{ return localStorage.getItem('guv_last_personel_id') || ''; }catch(e){ return ''; }
}
function rememberPersonelId(id){
  try{ localStorage.setItem('guv_last_personel_id', id); }catch(e){ /* önemli değil */ }
}

async function submitScan(itemId, label, p){
  const item = findItemById(itemId);
  let konumVerisi = { konumVarMi:false, mesafeMetre:null, konumUyari:false };
  if(State.qrAyarlar.aktif && item && item.lat!=null && item.lng!=null){
    const pos = await getCurrentPositionSafe(7000);
    if(pos){
      const mesafe = haversineMetre(item.lat, item.lng, pos.lat, pos.lng);
      const tolerans = State.qrAyarlar.toleransMetre || 150;
      konumVerisi = { konumVarMi:true, mesafeMetre: Math.round(mesafe), konumUyari: mesafe > tolerans };
    }
    // pos alınamazsa (izin verilmedi/zaman aşımı): konumVarMi false kalır, tarama yine de kaydedilir — engellemiyoruz.
  }
  return await logScanRemote({
    itemId, checkpointLabel: label,
    personelId: p.id, personelName: p.name,
    tarih: todayStr(), saat: new Date().toISOString(),
    ...konumVerisi,
  });
}

function renderScanConfirm(){
  const item = findItemById(SCAN_ITEM_ID);
  const label = item ? item.label : 'Kontrol Noktası';
  const remembered = State.personel.find(p=>p.id===rememberedPersonelId());

  if(remembered){
    // Bu telefon daha önce kimliğini onaylamış — tek dokunuşla onay
    app.innerHTML = `
      <div class="login-shell" style="text-align:center;">
        <h1>📍 Kontrol Noktası Onayı</h1>
        <p class="sub"><b>${label}</b></p>
        <p class="sub">👤 <b>${remembered.name}</b> olarak onaylanacak.</p>
        <div class="err" id="scanErr"></div>
        <button class="btn" id="scanQuickBtn" style="width:100%;margin-bottom:10px;">✓ Onayla</button>
        <button class="btn ghost" id="scanSwitchBtn" style="width:100%;">Ben değilim / kişi değiştir</button>
      </div>
    `;
    document.getElementById('scanQuickBtn').onclick = async ()=>{
      const btn = document.getElementById('scanQuickBtn');
      btn.disabled = true; btn.textContent = 'Konum kontrol ediliyor…';
      const ok = await submitScan(SCAN_ITEM_ID, label, remembered);
      if(ok){ showScanSuccess(label, remembered.name); }
      else{
        btn.disabled = false; btn.textContent = '✓ Onayla';
        document.getElementById('scanErr').textContent = 'Kaydedilemedi, bağlantınızı kontrol edip tekrar deneyin.';
      }
    };
    document.getElementById('scanSwitchBtn').onclick = ()=> renderScanConfirmFull(item, label);
    return;
  }

  renderScanConfirmFull(item, label);
}

function renderScanConfirmFull(item, label){
  app.innerHTML = `
    <div class="login-shell">
      <h1>📍 Kontrol Noktası Onayı</h1>
      <p class="sub"><b>${label}</b><br>İlk onay için personelinizi seçip PIN girin — bu telefon bundan sonra sizi hatırlayacak, sonraki noktalarda tek dokunuşla onaylayacaksınız.</p>
      <label>Personel</label>
      <select id="scanPersonel">
        ${State.personel.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
      </select>
      <label>PIN</label>
      <input type="password" id="scanPin" placeholder="••••" maxlength="8" autocomplete="new-password">
      <div class="err" id="scanErr"></div>
      <button class="btn" id="scanConfirmBtn" style="width:100%;">Onayla</button>
    </div>
  `;
  document.getElementById('scanConfirmBtn').onclick = async ()=>{
    const err = document.getElementById('scanErr');
    const pin = document.getElementById('scanPin').value.trim();
    const sel = document.getElementById('scanPersonel');
    const p = State.personel.find(x=>x.id===sel.value);
    if(!p){ err.textContent = 'Personel bulunamadı.'; return; }
    if(pin !== p.pin){ err.textContent = 'PIN hatalı.'; return; }
    const btn = document.getElementById('scanConfirmBtn');
    btn.disabled = true; btn.textContent = 'Konum kontrol ediliyor…';
    const ok = await submitScan(SCAN_ITEM_ID, label, p);
    if(ok){
      rememberPersonelId(p.id);
      showScanSuccess(label, p.name);
    } else {
      btn.disabled = false; btn.textContent = 'Onayla';
      err.textContent = 'Kaydedilemedi, bağlantınızı kontrol edip tekrar deneyin.';
    }
  };
}

function showScanSuccess(label, personelName){
  app.innerHTML = `
    <div class="login-shell" style="text-align:center;">
      <div style="font-size:48px;margin-bottom:12px;">✓</div>
      <h1>Kaydedildi</h1>
      <p class="sub">${label} — ${personelName} tarafından ${formatTime(new Date().toISOString())}'de doğrulandı.</p>
      <button class="btn ghost" style="width:100%;" onclick="location.href=SITE_URL">Panele Dön</button>
    </div>`;
}

/* ============================================================
   INIT
   ============================================================ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{ /* önemsiz, PWA kurulabilirliğini etkiler sadece */ });
}

(async function init(){
  app.innerHTML = `<div class="empty">Yükleniyor…</div>`;
  try{
    await ensureAuth();
    await loadCore();
    if(SCAN_ITEM_ID){
      renderScanConfirm();
    } else {
      const restored = restoreSessionIfValid();
      if(restored){
        State.session = restored;
        await loadActivityData();
      }
      render();
      if(restored) checkExpiryNotifications();
    }
  }catch(err){
    console.error('Başlatma hatası', err);
    app.innerHTML = `
      <div class="login-shell">
        <h1>Bir sorun oluştu</h1>
        <p class="sub">Sayfa başlatılırken beklenmeyen bir hata oluştu. Sayfayı yenilemeyi deneyin.</p>
        <button class="btn" onclick="location.reload()">Sayfayı Yenile</button>
      </div>
    `;
  }
})();
</script>
